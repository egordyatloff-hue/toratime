name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip build-essential libffi-dev openjdk-17-jdk-headless

      - name: Install buildozer
        run: |
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Prepare Android SDK
        run: |
          set -e
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > "$SDK/licenses/android-sdk-preview-license"
          cd "$SDK"
          if [ ! -x tools/bin/sdkmanager ]; then
            curl -fsSL -o cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q cmdline.zip
            rm -rf tools
            mv cmdline-tools tools
            chmod +x tools/bin/*
            rm cmdline.zip
          fi

      - name: Build APK
        run: |
          export LC_ALL=C
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
